name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web assets (CSS + JS)
        run: npm run build

      - name: Add Android platform if missing
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          for PERM in \
            "android.permission.SCHEDULE_EXACT_ALARM" \
            "android.permission.POST_NOTIFICATIONS" \
            "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"; do
            if ! grep -q "$PERM" "$MANIFEST"; then
              sed -i "s|</manifest>|<uses-permission android:name=\"$PERM\" />\n</manifest>|" "$MANIFEST"
              echo "Eklendi: $PERM"
            else
              echo "Zaten var: $PERM"
            fi
          done
          grep -n "uses-permission" "$MANIFEST"

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ilac-takip-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk